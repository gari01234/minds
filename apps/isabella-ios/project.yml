name: MINDS
options:
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    MINDS_BUNDLE_ID: local.minds.isabella
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  MINDS:
    type: application
    platform: iOS
    sources:
      - Sources
      - CaptureShared
      - SharedGlance
      - Assets.xcassets
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    entitlements:
      path: Config/MINDS.entitlements
      properties:
        com.apple.security.application-groups:
          - "group.$(MINDS_BUNDLE_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(MINDS_BUNDLE_ID)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Window
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Isabella usa el micrófono cuando hablas con ella.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Isabella puede transcribir tu voz para convertirla en mensajes.
        # The web app can attach photos, save images and use your location for the weather.
        # Without these texts iOS ends the app the moment the page asks.
        INFOPLIST_KEY_NSCameraUsageDescription: Window usa la cámara cuando haces una foto para adjuntarla.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Window abre tus fotos cuando eliges una para adjuntarla.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Window guarda en Fotos las imágenes que decides guardar.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Window usa tu ubicación para el tiempo de Ahora, solo si lo permites.
        # Custom keys (backend URL, public key, App Group) live in Config/App-Info.plist:
        # Xcode only maps INFOPLIST_KEY_* for keys it knows.
        INFOPLIST_FILE: Config/App-Info.plist
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: MINDSShare
        embed: true
      - target: MINDSWidget
        embed: true
    scheme:
      testTargets: []
  MINDSShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - CaptureShared
    info:
      path: Config/Share-Info.plist
      properties:
        CFBundleDisplayName: Window
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        MINDSAppGroupID: "group.$(MINDS_BUNDLE_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: Config/Share.entitlements
      properties:
        com.apple.security.application-groups:
          - "group.$(MINDS_BUNDLE_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(MINDS_BUNDLE_ID).share"
        SWIFT_VERSION: 5.10
        APPLICATION_EXTENSION_API_ONLY: YES
  MINDSWidget:
    type: app-extension
    platform: iOS
    sources:
      - WidgetExtension
      - SharedGlance
      - Sources/Features/Continuity/ContinuityItem.swift
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Window
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        MINDSAppGroupID: "group.$(MINDS_BUNDLE_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - "group.$(MINDS_BUNDLE_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(MINDS_BUNDLE_ID).widget"
        SWIFT_VERSION: 5.10
        APPLICATION_EXTENSION_API_ONLY: YES
