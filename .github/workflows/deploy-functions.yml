name: Deploy Supabase Edge Functions
# Manual on purpose: merging code never changes production by itself (merge ≠ deploy).
# Run from GitHub → Actions → "Deploy Supabase Edge Functions" → Run workflow,
# listing the functions to deploy separated by spaces.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Functions to deploy, separated by spaces (e.g. window-mcp isabella-chat)'
        required: true
        default: 'window-mcp'
permissions:
  contents: read
concurrency:
  group: supabase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'gari01234/minds' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The access token lives in this environment, so no other workflow can read it.
    environment: supabase
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lodexwyyynlarkqgkyhy
      FUNCTIONS: ${{ inputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN as a secret of the 'supabase' environment (Settings → Environments)."
            exit 1
          fi
      - name: Validate function names
        run: |
          set -f
          for f in $FUNCTIONS; do
            if ! [[ "$f" =~ ^[a-z0-9-]+$ ]] || [ ! -f "supabase/functions/$f/index.ts" ]; then
              echo "::error::Unknown function: $f"; exit 1
            fi
          done
      - name: Deploy
        run: |
          set -f
          for f in $FUNCTIONS; do
            echo "::group::Deploying $f"
            # verify_jwt and entrypoint come from supabase/config.toml.
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api
            echo "::endgroup::"
          done
      - name: Check the Window connector asks for sign-in
        if: contains(format(' {0} ', inputs.functions), ' window-mcp ')
        run: |
          url="https://$PROJECT_REF.supabase.co/functions/v1/window-mcp"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' -d '{}')
          header=$(curl -s -D - -o /dev/null -X POST "$url" -H 'content-type: application/json' -d '{}' | tr -d '\r' | grep -i '^www-authenticate:' || true)
          meta=$(curl -s "$url/.well-known/oauth-protected-resource")
          echo "status=$code"; echo "$header"; echo "$meta"
          [ "$code" = "401" ] || { echo "::error::Expected 401 from window-mcp, got $code"; exit 1; }
          echo "$header" | grep -q 'resource_metadata=' || { echo "::error::401 is missing the resource_metadata pointer (is verify_jwt still on?)"; exit 1; }
          echo "$meta" | grep -q '"resource":"https://lodexwyyynlarkqgkyhy.supabase.co/functions/v1/window-mcp"' || { echo "::error::Unexpected protected-resource metadata"; exit 1; }
