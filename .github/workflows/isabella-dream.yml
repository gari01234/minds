name: Isabella dreaming
# Once a night Isabella reviews what she talked about with Gari and consolidates her memory
# (pattern: Anthropic, "The components of agent memory", 06.11.2026).
# Since 08.11.2026 the night's pass is started by isabella-heartbeat (pg_cron) between 02:00 and 06:00
# local, because GitHub's schedule ran hours late (02:47 → 08:59). This workflow stays for a manual run;
# the Edge Function accepts it only from main (GitHub OIDC token, audience minds-isabella-dream).
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: isabella-dream
  cancel-in-progress: false
jobs:
  dream:
    if: github.repository == 'gari01234/minds' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Let Isabella dream
        run: |
          set -euo pipefail
          # A long backlog (first night) is read in a few passes.
          for pass in 1 2 3 4; do
            token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=minds-isabella-dream" | jq -r .value)
            code=$(curl -sS -o result.json -w '%{http_code}' --max-time 420 -X POST \
              "https://lodexwyyynlarkqgkyhy.supabase.co/functions/v1/isabella-dream" \
              -H "Authorization: Bearer $token" -H 'content-type: application/json' -d '{}')
            echo "pass=$pass status=$code"; cat result.json; echo
            if [ "$code" = "404" ]; then echo "::warning::isabella-dream is not deployed yet"; exit 0; fi
            [ "$code" = "200" ] || [ "$code" = "207" ]
            [ "$(jq -r '.more // false' result.json)" = "true" ] || break
          done
