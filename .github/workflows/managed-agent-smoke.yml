name: Managed Agents API Synthetic Smoke
on:
  pull_request:
    paths:
      - 'experiments/agent-runtime-parity/managed-smoke.mjs'
      - '.github/workflows/managed-agent-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-agents-session:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: experiments/agent-runtime-parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install client SDK for ephemeral managed session
        run: npm install --ignore-scripts --no-audit --no-fund --no-save openai@latest
      - name: Validate isolated smoke syntax
        run: node --check managed-smoke.mjs
      - name: Check availability of dedicated test key
        if: github.event_name == 'workflow_dispatch'
        id: parity_key
        env:
          OPENAI_API_KEY: ${{ secrets.MINDS_PARITY_OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "MANAGED_SMOKE_SKIPPED: dedicated temporary parity secret not configured"
          fi
      - name: Create and delete synthetic managed session (US retention applies)
        if: steps.parity_key.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        env:
          OPENAI_API_KEY: ${{ secrets.MINDS_PARITY_OPENAI_API_KEY }}
        timeout-minutes: 3
        run: node managed-smoke.mjs
