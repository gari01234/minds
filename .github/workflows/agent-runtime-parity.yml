name: Agent Runtime SDK Synthetic Parity
on:
  pull_request:
    paths:
      - 'experiments/agent-runtime-parity/**'
      - 'scripts/agent-runtime-parity-core.mjs'
      - 'tests/fixtures/agent-runtime-parity-synthetic-v01.json'
      - '.github/workflows/agent-runtime-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: experiments/agent-runtime-parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned SDK only for isolated fixture
        run: npm install --ignore-scripts --no-audit --no-fund --no-save
      - name: Exercise SDK with deterministic mock provider
        env:
          OPENAI_AGENTS_DISABLE_TRACING: '1'
        run: npm test
      - name: Validate optional real-model A/B script syntax
        run: |
          node --check live-synthetic.mjs
          node --check paged-synthetic.mjs
      - name: Detect dedicated parity project key (never print value)
        id: parity_key
        env:
          OPENAI_API_KEY: ${{ secrets.MINDS_PARITY_OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "LIVE_PARITY_SKIPPED: dedicated MINDS_PARITY_OPENAI_API_KEY not configured"
          fi
      - name: Compare real Responses and SDK on fictional evidence
        if: steps.parity_key.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          OPENAI_API_KEY: ${{ secrets.MINDS_PARITY_OPENAI_API_KEY }}
          OPENAI_AGENTS_DISABLE_TRACING: '1'
          PARITY_OPENAI_MODEL: gpt-5.6-luna
        timeout-minutes: 5
        run: node live-synthetic.mjs
      - name: Compare evidence-first completeness vs agent-directed pagination
        if: steps.parity_key.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          OPENAI_API_KEY: ${{ secrets.MINDS_PARITY_OPENAI_API_KEY }}
          OPENAI_AGENTS_DISABLE_TRACING: '1'
          PARITY_OPENAI_MODEL: gpt-5.6-luna
        timeout-minutes: 7
        run: node paged-synthetic.mjs
