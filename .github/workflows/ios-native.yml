name: Validate MINDS iOS

on:
  push:
    branches: [main]
    paths:
      - "apps/isabella-ios/**"
      - ".github/workflows/ios-native.yml"
      - ".github/workflows/ios-testflight.yml"
      - "tests/ios-testflight-readiness.test.mjs"
  pull_request:
    paths:
      - "apps/isabella-ios/**"
      - ".github/workflows/ios-native.yml"
      - ".github/workflows/ios-testflight.yml"
      - "tests/ios-testflight-readiness.test.mjs"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Confirm App Store Connect SDK requirements
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Validate release configuration
        run: node --test tests/ios-testflight-readiness.test.mjs

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare temporary Window App Store icon
        working-directory: apps/isabella-ios
        run: bash Config/prepare-app-icon.sh
      - name: Generate Xcode project
        working-directory: apps/isabella-ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: apps/isabella-ios
        run: |
          xcodebuild             -project MINDS.xcodeproj             -scheme MINDS             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build
