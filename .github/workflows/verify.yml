name: Verify MINDS
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node scripts/build.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/_shared/mission-runtime.ts supabase/functions/_shared/mission-runtime-routing.ts supabase/functions/_shared/openai-agents-runtime.ts supabase/functions/_shared/capability-registry.ts supabase/functions/_shared/capability-runtime.ts supabase/functions/isabella-agent-shadow/index.ts supabase/functions/isabella-chat/index.ts supabase/functions/isabella-capability-runtime/index.ts supabase/functions/isabella-capability-runner/index.ts supabase/functions/isabella-heartbeat/index.ts supabase/functions/isabella-mission-runner/index.ts supabase/functions/isabella-routine-runner/index.ts supabase/functions/isabella-push/index.ts supabase/functions/isabella-delivery-runner/index.ts supabase/functions/isabella-artifact-intake/index.ts supabase/functions/isabella-runtime-mcp/index.ts supabase/functions/isabella-operating-model/index.ts
      - run: deno test supabase/functions/_shared/mission-runtime.test.ts supabase/functions/_shared/mission-runtime-routing.test.ts supabase/functions/_shared/openai-agents-runtime.test.ts
