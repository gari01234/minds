name: Verify MINDS
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node scripts/build.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/isabella-chat/index.ts supabase/functions/isabella-mission-runner/index.ts supabase/functions/isabella-routine-runner/index.ts supabase/functions/isabella-push/index.ts supabase/functions/isabella-delivery-runner/index.ts
