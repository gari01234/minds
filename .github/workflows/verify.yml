name: Verify MINDS
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node --check apps/isabella-presence/ui/presence.js
      - run: node --check apps/isabella/dashboard.js
      - run: node --check apps/isabella/app.js
      - run: node scripts/build.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/_shared/mission-runtime.ts supabase/functions/_shared/mission-runtime-routing.ts supabase/functions/_shared/openai-agents-runtime.ts supabase/functions/_shared/capability-registry.ts supabase/functions/_shared/skill-registry.ts supabase/functions/_shared/persistent-work.ts supabase/functions/_shared/capability-runtime.ts supabase/functions/_shared/temporal-presentation.ts supabase/functions/_shared/constitutional-state.ts supabase/functions/isabella-agent-shadow/index.ts supabase/functions/isabella-chat/index.ts supabase/functions/isabella-self-review/index.ts supabase/functions/isabella-code-preparation/index.ts supabase/functions/isabella-capability-runtime/index.ts supabase/functions/isabella-capability-runner/index.ts supabase/functions/isabella-heartbeat/index.ts supabase/functions/isabella-mission-runner/index.ts supabase/functions/isabella-routine-runner/index.ts supabase/functions/isabella-push/index.ts supabase/functions/isabella-delivery-runner/index.ts supabase/functions/isabella-artifact-intake/index.ts supabase/functions/isabella-runtime-mcp/index.ts supabase/functions/isabella-operating-model/index.ts supabase/functions/isabella-work-ingest-runner/index.ts
      - run: deno test supabase/functions/_shared/mission-runtime.test.ts supabase/functions/_shared/mission-runtime-routing.test.ts supabase/functions/_shared/openai-agents-runtime.test.ts supabase/functions/_shared/temporal-presentation.test.ts supabase/functions/_shared/skill-registry.test.ts supabase/functions/_shared/persistent-work.test.ts supabase/functions/_shared/constitutional-state.test.ts

  build99c-postgres:
    name: Build 99C SQL integration (ephemeral PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minds_99c_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minds_99c_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: minds_99c_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Build synthetic owner-scoped schema
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/build99c-fixture.sql
      - name: Apply exact Build 99C migration (no production connection)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261023083324_minds_task_team_allocations_v1.sql
      - name: Verify SQL integrity, RLS, and negative cases
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/build99c-acceptance.sql

  routines-postgres:
    name: Routine lifecycle SQL integration (ephemeral PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minds_routines_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minds_routines_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: minds_routines_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Build synthetic owner-scoped schema
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/routines-fixture.sql
      - name: Apply exact routine migration (no production connection)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261030153655_minds_reviewed_routine_management_v1.sql
      - name: Verify SQL integrity, RLS, and negative cases
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/routines-acceptance.sql

  window-postgres:
    name: Window self-review SQL integration (ephemeral PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minds_window_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minds_window_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: minds_window_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Build synthetic owner-scoped schema
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/window-fixture.sql
      - name: Apply exact Window migration (no production connection)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261030165228_minds_window_daily_review_v1.sql
      - name: Apply required project category integration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261030170807_minds_window_project_category.sql
      - name: Verify SQL integrity, RLS, and negative cases
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/window-acceptance.sql
      - name: Apply code preparation and verify job authority
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261030184102_minds_window_code_preparation.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261030185501_minds_window_code_retry.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261031114542_minds_window_revision_retry.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/window-code-acceptance.sql

  browser-daily-workspace:
    name: Desktop browser layout (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Build and serve the real PWA bundle
        run: |
          node scripts/build.mjs
          python3 -m http.server 8765 --directory dist >/tmp/minds-local-server.log 2>&1 &
          sleep 2
      - name: Measure layout and verify original More menu
        run: node tests/browser-daily-workspace.cjs

  window-sandbox:
    name: Window credential-free test sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test baseline in the same offline container used for candidates
        run: |
          docker build -t minds-window-sandbox -f scripts/window-code.Dockerfile .
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 --memory=2g --cpus=2 --read-only --user=1000:1000 --tmpfs /tmp:rw,exec,size=1536m --mount type=bind,source="$PWD",target=/source,readonly --env GITHUB_SHA="$GITHUB_SHA" minds-window-sandbox sh -c 'cp -R /source /tmp/work && cp -R /opt/deno-cache /tmp/deno-cache && export DENO_DIR=/tmp/deno-cache && cd /tmp/work && node /opt/window-code-checks.mjs'


  work-buckets-postgres:
    name: Work Bucket lifecycle SQL (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minds_work_bucket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minds_work_bucket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: minds_work_bucket_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Seed isolated owner-scoped fixture
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/work-buckets-fixture.sql
      - name: Apply exact migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261031120000_minds_work_bucket_lifecycle_v1.sql
      - name: Verify atomic order, safe archive and negative ownership cases
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/work-buckets-acceptance.sql
      - name: Apply completed-task preservation and restore migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261031165000_minds_work_bucket_completed_history_v2.sql
      - name: Verify completed tasks remain in historical Buckets
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/work-buckets-history-v2-acceptance.sql
