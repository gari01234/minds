name: Build Isabella Presence Windows Installer

on:
  pull_request:
    paths:
      - "apps/isabella-presence/**"
      - "apps/isabella/BUILD-80.1.md"
      - "apps/isabella/BUILD-80.2.md"
      - "apps/isabella/BUILD-80.3.md"
      - "apps/isabella/BUILD-80.4.md"
      - "apps/isabella/BUILD-82.md"
      - ".github/workflows/windows-presence-installer.yml"
  push:
    branches: [main]
    paths:
      - "apps/isabella-presence/**"
      - "apps/isabella/BUILD-80.1.md"
      - "apps/isabella/BUILD-80.2.md"
      - "apps/isabella/BUILD-80.3.md"
      - "apps/isabella/BUILD-80.4.md"
      - "apps/isabella/BUILD-82.md"
      - ".github/workflows/windows-presence-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/isabella-presence/src-tauri

      - name: Build NSIS installer
        working-directory: apps/isabella-presence/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.0 build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Isabella-Presence-Windows-0.2.2
          path: apps/isabella-presence/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
